name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, with or without the v prefix"
        required: true
        type: string
      release_notes:
        description: "Optional release notes shown above the generated commit list"
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ohmegastar/nbe

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version and release notes
        id: release
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          MAINTAINER_NOTES: ${{ inputs.release_notes }}
        run: |
          $version = $env:REQUESTED_VERSION.TrimStart('v')
          $notesPath = Join-Path $pwd "release-notes-input.md"
          [System.IO.File]::WriteAllText($notesPath, $env:MAINTAINER_NOTES, [System.Text.UTF8Encoding]::new($false))
          ./scripts/release.ps1 -Version "v$version" -NotesFile $notesPath -Output release-notes.md
          "version=v$version" >> $env:GITHUB_OUTPUT

      - name: Commit changelog and create tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:master "$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Publish legacy ARM image tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:aarch64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "$VERSION" --title "Release $VERSION" --notes-file release-notes.md