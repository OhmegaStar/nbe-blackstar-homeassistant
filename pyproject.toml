[project]
name = "nbe-blackstar-homeassistant"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=1.6,<3",
    "pycryptodome>=3.20",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"